<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>智渝游 · 注册</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css?v=20260820" />
</head>
<body>
  <header class="site-header"><div class="header-inner"><a class="logo" href="/"><span class="logo-mark"><img src="assets/logo.jpg" alt="" /></span><span class="logo-text">智渝游</span></a></div></header>
  <main class="auth-wrap">
    <section class="auth-card">
      <h1>注册账号</h1>
      <p>创建账号后即可保存偏好并使用完整功能。</p>
      <form class="auth-form" id="registerForm">
        <input class="cta-input" id="regUsername" type="text" placeholder="昵称" />
        <input class="cta-input" id="regPhone" type="tel" placeholder="手机号" />
        <input class="cta-input" id="regPassword" type="password" placeholder="不少于 6 位密码" />
        <button class="btn btn-primary btn-block" type="submit">注册</button>
      </form>
      <p class="auth-msg" id="registerMsg"></p>
      <p class="section-desc">已有账号？<a href="login" id="linkToLogin">去登录</a></p>
    </section>
  </main>
  <script src="js/auth-client.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/float-ai.js?v=20260820" defer></script>
</body>
</html>
