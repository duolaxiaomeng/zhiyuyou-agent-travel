<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>智渝游 · 农产品直购</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg?v=4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css?v=20260820" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="/">
          <span class="logo-mark" aria-hidden="true"><img src="assets/logo.jpg" alt="" /></span>
          <span class="logo-text">智渝游</span>
        </a>
        <button type="button" class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav" aria-label="打开菜单">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <nav class="site-nav" id="siteNav">
          <ul class="nav-list">
            <li><a data-page="index.html" href="/">首页</a></li>
            <li><a data-page="chat.html" href="chat">渝小智</a></li>
            <li><a data-page="planner.html" href="planner">AI路线规划</a></li>
            <li><a data-page="vr.html" href="vr">VR导览</a></li>
            <li><a data-page="shop.html" href="shop">农产品直购</a></li>
            <li><a data-page="guide.html" href="guide">交流中心</a></li>
          </ul>
          <div class="nav-user" id="navUser"></div>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="page-hero">
        <div class="container">
          <h1>乡愁好物直购</h1>
          <p>精选重庆乡镇农特产品，支持在线加入购物车与结算流程。</p>
        </div>
      </section>

      <section class="section section-farm" id="farm-shop">
        <div class="container">
          <div class="farm-grid" id="farmGrid"></div>
        </div>
      </section>
    </main>

    <a class="shop-orders-fab" href="orders" aria-label="查看我的订单">我的订单</a>

    <div class="cart-bar" id="cartBar" hidden>
      <div class="cart-bar-inner">
        <span class="cart-bar-text" id="cartBarText">购物车为空</span>
        <div class="cart-bar-right">
          <a class="btn btn-primary btn-sm" href="cart-detail" id="cartManageBtn" aria-label="管理购物车">管理购物车</a>
          <button type="button" class="btn btn-primary btn-sm" id="cartCheckout" disabled>去结算</button>
        </div>
      </div>
    </div>

    <div class="shop-modal" id="payModal" hidden>
      <div class="shop-modal-mask" data-close="payModal"></div>
      <section class="shop-modal-card" role="dialog" aria-modal="true" aria-labelledby="payTitle">
        <header class="shop-modal-head shop-modal-head--pay">
          <h2 id="payTitle">确认支付</h2>
          <p>文旅助农订单</p>
        </header>
        <div class="shop-modal-body">
          <p class="pay-amount-label">支付金额</p>
          <p class="pay-amount" id="payAmount">¥0.00</p>
          <div class="pay-order" id="payOrderInfo"></div>
          <p class="pay-tip">确认后将进入订单状态页，请核对商品与金额信息。</p>
        </div>
        <footer class="shop-modal-foot">
          <button type="button" class="btn btn-ghost btn-sm" id="payCancel">取消</button>
          <button type="button" class="btn btn-primary btn-sm" id="payConfirm">确认支付</button>
        </footer>
      </section>
    </div>

    <div class="shop-modal" id="traceModal" hidden>
      <div class="shop-modal-mask" data-close="traceModal"></div>
      <section class="shop-modal-card" role="dialog" aria-modal="true" aria-labelledby="traceTitle">
        <header class="shop-modal-head shop-modal-head--trace">
          <h2 id="traceTitle">溯源证书</h2>
          <p>产地信息可查 · 全程可追溯</p>
        </header>
        <div class="shop-modal-body">
          <dl class="trace-list" id="traceList"></dl>
          <p class="trace-pass">验证通过：证书信息与商品一一对应。</p>
        </div>
        <footer class="shop-modal-foot shop-modal-foot--single">
          <button type="button" class="btn btn-primary btn-sm" id="traceClose">关闭</button>
        </footer>
      </section>
    </div>

    <div class="shop-modal" id="paySuccessModal" hidden>
      <div class="shop-modal-mask"></div>
      <section class="shop-modal-card shop-modal-card--success" role="dialog" aria-modal="true" aria-labelledby="paySuccessTitle">
        <div class="pay-success-icon">✓</div>
        <h2 id="paySuccessTitle" class="pay-success-title">支付成功</h2>
        <p class="pay-success-desc">订单已提交，助农商品将尽快安排发货。</p>
        <p class="pay-success-countdown" id="paySuccessCountdown">3 秒后自动关闭</p>
      </section>
    </div>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-brand">智渝游</p>
      </div>
    </footer>

    <script src="js/auth-client.js"></script>
    <script src="js/user-data-api.js"></script>
    <script src="js/main.js" defer></script>
    <script src="js/features.js" defer></script>
    <script src="js/float-ai.js?v=20260820" defer></script>
  </body>
</html>
